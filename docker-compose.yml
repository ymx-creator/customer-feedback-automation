services:
  web:
    build:
      context: .
    environment:
      TZ: Europe/Paris
      PORT: 5000
      DEBUG: 'false'
      DISABLE_SCHEDULER: 'true'
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in Dokploy}
      AUTH_SALT: ${AUTH_SALT:?Set AUTH_SALT in Dokploy}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Dokploy}
    command:
      [
        'gunicorn',
        '--bind',
        '0.0.0.0:5000',
        '--workers',
        '1',
        '--threads',
        '1',
        '--timeout',
        '300',
        '--access-logfile',
        '-',
        'app:app',
      ]
    shm_size: 1gb
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/mcdo-bot:size=256m,mode=755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  scheduler:
    build:
      context: .
    environment:
      TZ: Europe/Paris
      DISABLE_SCHEDULER: 'true'
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in Dokploy}
      AUTH_SALT: ${AUTH_SALT:?Set AUTH_SALT in Dokploy}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Dokploy}
    command: ['python', 'scheduler.py']
    shm_size: 1gb
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/mcdo-bot:size=256m,mode=755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    restart: unless-stopped
